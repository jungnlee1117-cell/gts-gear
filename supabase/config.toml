# Edge Functions JWT 검증 비활성화
# - send-push: consultation_requested는 함수 내부에서 인증 없이 처리
# - 배포 후 반드시 적용 확인: supabase functions deploy send-push

[functions.send-push]
verify_jwt = false

[functions.vapid-public-key]
verify_jwt = false

[functions.giti-biweekly-report]
verify_jwt = false

# teacher-hr: JWT는 함수 내부에서 검증한다.
# verify_jwt=true 이면 브라우저 OPTIONS preflight에 Authorization이 없어
# CORS가 실패하고 "Failed to send a request to the Edge Function" 이 난다.
[functions.teacher-hr]
verify_jwt = false

# kiosk: 기기 PIN / 개인 PIN 은 함수 내부에서 검증. JWT 없이 진입.
[functions.kiosk]
verify_jwt = false
