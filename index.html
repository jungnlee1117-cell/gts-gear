<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/gts-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#16a34a" />
    <meta name="description" content="GTS 통합 플랫폼 — 교구, 스케줄, 영상자료실" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="GTS 시스템" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>GTS 시스템</title>
    <script>
      /* /kiosk: 메인 manifest를 키오스크용으로 교체.
         MutationObserver + document.title 조합은 title 텍스트 변경이 childList로
         다시 감지되어 무한 루프(흰 화면)를 만들므로 짧은 폴링만 사용한다. */
      (function () {
        var path = location.pathname || "";
        if (path !== "/kiosk" && path.indexOf("/kiosk/") !== 0) return;
        var KIOSK_MF = "/kiosk.webmanifest";
        function applyKioskPwa() {
          var links = document.querySelectorAll('link[rel="manifest"]');
          if (!links.length) {
            var link = document.createElement("link");
            link.rel = "manifest";
            link.href = KIOSK_MF;
            document.head.appendChild(link);
          } else {
            for (var i = 0; i < links.length; i++) {
              if (links[i].getAttribute("href") !== KIOSK_MF) {
                links[i].setAttribute("href", KIOSK_MF);
              }
            }
          }
          if (document.title !== "GTS 키오스크") document.title = "GTS 키오스크";
          var appleTitle = document.querySelector('meta[name="apple-mobile-web-app-title"]');
          if (appleTitle && appleTitle.getAttribute("content") !== "GTS 키오스크") {
            appleTitle.setAttribute("content", "GTS 키오스크");
          }
          var theme = document.querySelector('meta[name="theme-color"]');
          if (theme && theme.getAttribute("content") !== "#15803d") {
            theme.setAttribute("content", "#15803d");
          }
          document.documentElement.classList.add("kiosk-root");
        }
        applyKioskPwa();
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", applyKioskPwa);
        }
        var n = 0;
        var timer = setInterval(function () {
          applyKioskPwa();
          if (++n >= 25) clearInterval(timer);
        }, 100);
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <p style="margin:24px;font:600 16px/1.4 -apple-system,sans-serif;color:#64748b">로딩 중…</p>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
